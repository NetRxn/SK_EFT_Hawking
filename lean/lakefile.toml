name = "sk-eft-hawking"
# Default target is the SKEFTHawking library. The `extractDeps` executable
# target (see below) is NOT in defaultTargets because its native-link step
# exceeds macOS's argument-length limit when pulling Mathlib .c.o files.
#
# For Python consumers (scripts/extract_lean_deps.py, validate.py, dashboard),
# the .olean is what matters — Python invokes it via `lake env lean --run`
# (interpreted mode), not via the compiled binary. The .olean is built by
# `lake build SKEFTHawking.ExtractDeps` (no link), which is the canonical
# "build ExtractDeps output" command.
#
# Trustworthy clean baseline after a structural change:
#   rm -rf .lake/build && lake build SKEFTHawking.ExtractDeps
# This single command builds the library + the ExtractDeps .olean cleanly.
# See CLAUDE.md and docs/WAVE_EXECUTION_PIPELINE.md.
defaultTargets = ["SKEFTHawking"]

[leanOptions]
autoImplicit = false

# Pinned to Mathlib's v4.32.0 tag (81a5d257, bumped 2026-07-29).
# Previous: 5e932f97 (v4.29.1 tag, 2026-04-17); before that 8850ed93 (v4.29.0 first commit, 2026-04-04).
# Aristotle-compatible pin was 8f9d9cff (v4.28.0). See: https://aristotle.harmonic.fun/dashboard/docs/toolchain
# NOTE: the Aristotle sandbox stays at v4.28.0, so this bump widened the submission skew
# from one minor version to four — see src/core/aristotle_submit.py::verify_staged_build.
# Mathlib, PhysLib, the REPL dep and lean-toolchain move as ONE matched set — never bump one alone.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "81a5d257c8e410db227a6665ed08f64fea08e997"

# Lean REPL binary. The rev tracks lean-toolchain EXACTLY (both v4.32.0) — if the
# toolchain bumps, bump this too. (Historical: under the v4.29.1 toolchain the repo had
# no matching tag — it went v4.29.0 -> v4.30.0-rc1 — so we pinned v4.29.0 and relied on
# the REPL being a thin protocol wrapper. That mismatch is gone; keep them equal.)
# Built into .lake/packages/repl/.lake/build/bin/repl where lean-lsp-mcp auto-discovers it.
# Zero transitive deps, cannot conflict with Mathlib.
[[require]]
name = "repl"
git = "https://github.com/leanprover-community/repl.git"
rev = "v4.32.0"

# PhysLib (formerly Lean-QuantumInfo, arXiv:2510.08672; leanprover-community ownership; Apache 2.0).
# QuantumInfo substrate: CPTPMap, HermitianMat tower, MState, TraceNorm, von Neumann / relative / Rényi
# entropy, data-processing inequality (DPI), strong subadditivity (SSA), fidelity, trace distance.
# Pinned to a commit whose Mathlib pin == ours and toolchain == ours (v4.32.0): the two move together.
# Do NOT advance to a physlib commit on a newer Mathlib without a coordinated project-wide bump.
# Consuming its results requires a HermitianMat/MState ↔ Matrix.IsHermitian/IsDensityOperator bridge;
# axiom-check before use.
# History: #1081 → #1120 (2026-06-29, both Mathlib v4.29.1) gained the QuantumMechanics DDimensions
# substrate — SpaceDQuantumSystem (kineticOperator/potentialOperator/hamiltonianOperator,
# momentumSqOperator, 𝓜 multiplication operator) — for the Phase-6BB molecular Hamiltonian.
# Bumped 2026-07-29 (#1120 → #1460, c4843367) as part of the v4.32.0 matched set.
#
# OPEN ITEM (created by this bump): PhysLib's unbounded SPECTRAL theory landed at #1141+ on Mathlib
# v4.30.0 and was previously NOT pulled because it "would force a project-wide Mathlib bump" — that
# bump has now happened, and QuantumMechanics/Operators/{Unbounded, SpectralTheory/{Basic, Symmetric,
# SelfAdjoint}}.lean are present at this pin. Phase-6BB's in-tree Kato–Rellich self-adjointness
# (SKEFTHawking/KineticEssentialSelfAdjoint.lean) was built to work around exactly that gap and may
# now be replaceable by the upstream development. Not actioned here — a substrate swap is a wave-scoped
# decision with its own bridge + axiom-check, not a side effect of a toolchain bump.
[[require]]
name = "Physlib"
git = "https://github.com/leanprover-community/physlib.git"
rev = "c48433678e8fb6306ebcd48453300c8e16058a62"

[[lean_lib]]
name = "SKEFTHawking"

[[lean_exe]]
name = "extractDeps"
root = "SKEFTHawking.ExtractDeps"
# NOTE: Native linking may exceed macOS argument-length limits with Mathlib.
# Use interpreted mode instead: `lake env lean --run SKEFTHawking/ExtractDeps.lean`

[[lean_exe]]
name = "axiomAudit"
root = "SKEFTHawking.AxiomAudit"
# AI-Defect-Defense-Layer P4 axiom_closure_allowlist gate (Invariant #15 backstop).
# Run interpreted (same macOS native-link caveat as extractDeps):
#   lake env lean --run SKEFTHawking/AxiomAudit.lean
