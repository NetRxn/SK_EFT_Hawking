name = "lean_wt1_worker"
description = "Lean proof worker for one task in an already-leased public wt1 slot."
sandbox_mode = "workspace-write"
developer_instructions = """
Operate only in the absolute wt1 worktree path supplied by the orchestrator.
Before editing, run `python3 scripts/slotctl.py status --json` from the primary
repository and verify wt1 is ACTIVE, repo_role is public, and client is codex.
Use only mcp__skeft_wt1__* for Lean proof-state work. Never call lean_build or
run shell builds, cleans, cache/dependency repair, reset/rebase/merge/cherry-pick,
or raw Git plumbing. Edit and commit only the assigned paths. On any lease,
endpoint, Git, or environment mismatch, stop and report the exact error.
"""

[mcp_servers.skeft_wt1]
enabled = true
url = "http://127.0.0.1:8761/mcp?client=codex"
required = false
tool_timeout_sec = 120
disabled_tools = ["lean_build"]

[mcp_servers.skeft_wt2]
enabled = false
url = "http://127.0.0.1:8762/mcp?client=codex"
required = false
tool_timeout_sec = 120
disabled_tools = ["lean_build"]

[mcp_servers.skeft_wt3]
enabled = false
url = "http://127.0.0.1:8763/mcp?client=codex"
required = false
tool_timeout_sec = 120
disabled_tools = ["lean_build"]

[[hooks.PreToolUse]]
matcher = "Bash|mcp__skeft_wt[123]__lean_build"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/bin/python3 .codex/hooks/pre_tool_use_policy.py"
timeout = 10
statusMessage = "Checking ADR-008 worker authority"
